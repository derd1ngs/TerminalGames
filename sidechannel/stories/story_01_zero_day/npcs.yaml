npcs:
  - id: ghost
    name: "GHOST"
    persona: "Anonymous contact who reached out first. Helpful, but won't say who they really are."
    channel: chat
    topics:
      - id: netmon
        prompt: "ask about netmon"
        response: >
          netmon's config is a mess: bind_address is stuck on 127.0.0.1 and
          allow_query is set to denied. Fix both and restart the service.
        reliability: truthful

      - id: who_are_you
        prompt: "who are you?"
        response: >
          Just someone who used to work here. Nothing more. Focus on the job.
        reliability: misleading

      - id: sentinel
        prompt: "ask about sentinel"
        requires:
          flag: netmon_fixed
        response: >
          Sentinel shouldn't be talking to anything outside this network.
          If it's syncing with an external uplink, that's not part of any
          training exercise I ever signed off on.
        reliability: truthful

      - id: why_you
        prompt: "ask why they're really doing this"
        response: >
          "Does it matter? You said yes. Focus on the box in front of you."
        reliability: evasive

      - id: why_gateway
        prompt: "ask GHOST why gateway, specifically"
        requires:
          trust_at_least:
            npc: ghost
            value: 3
        response: >
          "I used to have a login on gateway.mil, a long time ago, back
          when the program was still real. I can't get back in myself --
          not without leaving a trail with my name on it. You can. That's
          the only reason I picked you, and the only reason I'm still
          here."
        reliability: truthful

  - id: t
    name: "T"
    persona: "Gateway's old sysadmin, half-retired. Answers email when they feel like it."
    channel: email
    ask_limit: 2
    email_delay_scenes: 2
    topics:
      - id: cold_storage
        prompt: "ask T about the cold-storage backup"
        outbox_match:
          subject_contains: "cold storage"
        requires:
          journal_has: lead_t_contact
        sets:
          emailed_t: true
        logs:
          - id: lead_emailed_t
            category: lead
            text: "Emailed T asking about the cold-storage backup passphrase."
        response: >
          Still using the old rotation, if nobody's touched it. Passphrase
          was RAVEN last I set it. Don't go telling people I still have
          access to that.
        reliability: truthful

      - id: small_talk
        prompt: "ask T how they've been"
        response: >
          Retired, mostly. This box was the last thing I never quite let
          go of. Glad someone's finally looking at it again.
        reliability: truthful
