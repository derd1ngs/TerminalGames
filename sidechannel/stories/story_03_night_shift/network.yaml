                type: text
                content: "build user home. nothing to see here."
              .cache:
                type: dir
                entries:
                  deploy_key.enc:
                    type: cipher
                    cipher: caesar
                    ciphertext: "opawzj@xtcczc alddhzco: etophlepc-9"
                    plaintext: "deploy@mirror password: tidewater-9"
                    on_success_flag: found_deploy_key

  mirror:
    address: "10.60.9.1"
    banner: "mirror.lantern -- public release mirror. ALL SESSIONS ARE MONITORED."
    requires_to_connect:
      tool: deploy_key
    logins:
      deploy: "tidewater-9"
    services:
      publisher:
        config_path: /etc/publisher/publisher.conf
        required_config:
          serve_unsigned: "no"
        on_fix_flag: rogue_pulled
    filesystem:
      etc:
        type: dir
        entries:
          publisher:
            type: dir
            entries:
              publisher.conf:
                type: config
                values: {serve_unsigned: "yes", channel: "stable"}
      srv:
        type: dir
        entries:
          releases:
            type: dir
            entries:
              v4.2.0.tar.gz:
                type: text
                content: "(signed release)"
              v4.2.1.tar.gz:
                type: text
                content: "(UNSIGNED release -- served because serve_unsigned=yes)"
