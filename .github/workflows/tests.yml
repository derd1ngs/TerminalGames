name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with test dependencies
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with lint dependencies
        run: pip install -e ".[lint]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy terminalgames

  package:
    # A real (non-editable) install must ship the stories as package data --
    # an editable install hides it if they're missing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: pip wheel --no-deps -w dist .

      - name: Install it into a clean venv and run it outside the repo
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/venv/bin/sidechannel --list | tee stories.txt
          grep -q story_01_zero_day stories.txt
          grep -q story_02_dead_drop stories.txt
          grep -q story_03_night_shift stories.txt
          /tmp/venv/bin/python -m terminalgames.tools.check_story --all

  web-e2e:
    # Plays both stories in headless Firefox against a freshly built site
    # (web/e2e/e2e.mjs). Pyodide itself loads from the jsdelivr CDN.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/e2e/package-lock.json

      - name: Build and serve the site
        run: |
          python web/build.py _site
          python -m http.server -d _site 8000 --bind 127.0.0.1 &
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 0.5; done
          echo "site did not come up" >&2
          exit 1

      - name: Install Playwright and Firefox
        working-directory: web/e2e
        run: |
          npm ci
          npx playwright install --with-deps firefox

      - name: Run browser end-to-end test
        working-directory: web/e2e
        run: node e2e.mjs http://127.0.0.1:8000/

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: web/e2e/shots/
