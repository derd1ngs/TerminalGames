name: Release

# On a version tag (e.g. v1.0.0): build the sdist and wheel, check them,
# install the wheel into a clean venv and run it outside the repo, then
# publish to PyPI via trusted publishing (OIDC -- no token stored in the
# repo) and attach the files to a GitHub release.
#
# One-time setup on pypi.org: a (pending) trusted publisher for project
# `sidechannel`, owner `derd1ngs`, repo `sidechannel`, workflow
# `release.yml`, environment `pypi`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        run: |
          version="v$(python -c 'import terminalgames; print(terminalgames.__version__)')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match the package version $version" >&2
            exit 1
          fi

      - name: Build and check
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Install the wheel into a clean venv and run it outside the repo
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/venv/bin/sidechannel --list | tee stories.txt
          grep -q story_03_night_shift stories.txt
          /tmp/venv/bin/python -m terminalgames.tools.check_story --all

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sidechannel/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Install with \`pipx install sidechannel\`. See [CHANGELOG.md](https://github.com/derd1ngs/sidechannel/blob/main/CHANGELOG.md)."
