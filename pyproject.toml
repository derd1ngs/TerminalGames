[build-system]
requires = ["setuptools>=77"]  # 77+: license-files
build-backend = "setuptools.build_meta"

[project]
# The game is "Side Channel": PyPI name and command `sidechannel`. The
# import package keeps its original name, `terminalgames`.
name = "sidechannel"
dynamic = ["version"]  # from terminalgames/__init__.py -- the one place to bump it
description = "Side Channel: a hacker-themed text adventure with a fake terminal, playable in a terminal or a browser"
readme = "README.md"
license-files = ["LICENSE"]
keywords = ["game", "text adventure", "interactive fiction", "hacker", "terminal", "textual"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "pyyaml>=6.0",
    "textual>=0.60",
    "platformdirs>=3.6",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]
lint = ["ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.urls]
"Play in your browser" = "https://derd1ngs.github.io/sidechannel/"
Source = "https://github.com/derd1ngs/sidechannel"
Issues = "https://github.com/derd1ngs/sidechannel/issues"
Changelog = "https://github.com/derd1ngs/sidechannel/blob/main/CHANGELOG.md"

[project.scripts]
sidechannel = "terminalgames.main:main"

[tool.setuptools.packages.find]
include = ["terminalgames*"]

[tool.setuptools.dynamic]
version = {attr = "terminalgames.__version__"}

[tool.setuptools.package-data]
terminalgames = ["stories/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
