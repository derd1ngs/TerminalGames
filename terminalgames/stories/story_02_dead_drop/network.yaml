  vault:
    address: "10.13.0.9"
    banner: "vault.drop - OpenSSH_2.3 (password authentication only)"
    logins:
      mara: "lighthouse-42"
    on_connect_flag: on_vault
    services:
      replica:
        config_path: /etc/replica/replica.conf
        required_config:
          mode: "primary"
    filesystem:
      etc:
        type: dir
        entries:
          replica:
            type: dir
            entries:
              replica.conf:
                type: config
                values: {mode: "standby", primary_host: "archive.drop"}
      srv:
        type: dir
        entries:
          drop:
            type: dir
            entries:
              manifest.txt:
                type: text
                content: |
                  DROP MANIFEST (auto-generated)
                  files .......... 214
                  size ........... 1.9 GB
                  replica ........ STANDBY
                  primary ........ archive.drop -- UNREACHABLE for 3 days
                  note ........... drop is read-only until the replica is promoted
              RUNBOOK:
                type: text
                content: |
                  REPLICA RECOVERY -- mara, for whoever comes after me

                  If the primary is gone, promote the replica. Do exactly this,
                  in exactly this order. Anything else and it re-syncs from the
                  dead primary and eats the drop.

                    1. systemctl status replica
                    2. set /etc/replica/replica.conf mode primary
                    3. systemctl restart replica
