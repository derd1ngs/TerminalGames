id: chapter_01
scenes:
  - id: intro
    type: narrative
    text: |
      2:14 AM. Your terminal chimes -- an incoming chat request from a handle
      you don't recognize: GHOST.

      GHOST: "You're better at this than the people you usually talk to. I
      need someone who can get into a box called gateway.mil without leaving
      a mess. Something's running on it that shouldn't be. You in?"
    choices:
      - text: "Ask GHOST what's really going on before agreeing to anything."
        next: briefing
      - text: "Log off. This smells like a setup."
        next: ending_ignored

  - id: ending_ignored
    type: ending
    text: |
      You close the connection and pour yourself a coffee. Whatever GHOST
      wanted, it's someone else's problem now. Some doors are better left
      unopened.

      -- ENDING: Walked Away Before It Started --

  - id: briefing
    type: narrative
    text: |
      GHOST: "gateway.mil is a decommissioned military training network.
      It should be dead. It isn't. I don't have a way in myself -- you do.
      Get in, look around, and tell me what you find. That's all I'm asking."

      "One more thing," GHOST adds, "your shell speaks for itself -- `help`
      lists what it can do, and `whoami` never lies."

      You pull up a terminal of your own.
    choices:
      - text: "Fine. Let's see what's out there."
        next: "chapter_01:recon"
        sets:
          trust.ghost: 1

  - id: recon
    type: terminal
    text: |
      Your own machine hums quietly. Before you touch anything remote,
      GHOST's voice comes through one more time: "Get your bearings first.
      `whoami` will tell you who this shell thinks you are. `help` lists
      every command it understands. When you're ready, `scan gateway` to
      make sure it's actually listening, then `connect gateway`."
    terminal:
      win_flag: connected_gateway
      next: "chapter_01:gateway_shell"
      logs:
        - id: trace_gateway_connect
          category: trace
          text: "Connected to gateway.mil (10.44.0.1) using the address GHOST provided."

  - id: gateway_shell
    type: terminal
    text: |
      You're in. gateway.mil looks like it's been running on autopilot for
      years -- default banners, nobody logged in but you. `ls` and `cd`
      will get you around; `cat` reads whatever you land on, and `grep`
      searches inside a file for a word if you don't want to read the
      whole thing. Something called netmon has been dead for a while,
      according to the filesystem -- and according to `systemctl status
      netmon`, if you want to check for yourself.

      Whatever you learn along the way, `journal` (or `notebook`) keeps a
      running log of it automatically, so you don't have to remember it
      all yourself.
    terminal:
      win_flag: netmon_fixed
      next: "chapter_01:discovery"
      logs:
        - id: trace_netmon_fixed
          category: trace
          text: "Restored the netmon service on gateway.mil; internal network is now visible."
        - id: lead_t_contact
          category: lead
          text: "A note on gateway, signed '-T', mentions an old admin who might still answer email about this box."

  - id: discovery
    type: narrative
    text: |
      With netmon back up, the internal topology resolves in front of you:
      one other live host, sentinel.internal, quietly syncing with something
      outside this network on a schedule that looks deliberate, not
      automated. A training simulator that phones home doesn't need to talk
      to anything real.

      There's a third address too -- 10.44.0.9, the same one from that
      login line in gateway's syslog. archive.mil, an old backup server
      that has no business still being powered on. Probably nothing.
      Might be worth a look before you commit to sentinel.

      This isn't decommissioned. Something is still watching this network,
      or something on this network is still watching the real world.
    choices:
      - text: "Push further and see what sentinel is actually doing."
        next: "chapter_02:reach_sentinel"
        sets:
          trust.ghost: 1
      - text: "Dig through that old archive box first."
        next: archive_shell
      - text: "You've seen enough. Disconnect and walk away."
        next: ending_backed_out

  - id: archive_shell
    type: terminal
    text: |
      GHOST: "archive.mil? Huh. Didn't even know that was still up. Go
      ahead, it's not going anywhere."

      `connect archive` if you want to poke around -- `ls`/`cd`/`cat` to
      look, `grep` if you're hunting for something specific, `decrypt` if
      you find something locked.
    terminal:
      win_flag: found_archive_report
      next: "chapter_01:archive_return"
      logs:
        - id: suspect_sentinel_history
          category: suspect
          text: "An old incident report on archive.mil shows sentinel was already logging unscheduled uplinks years ago -- flagged, never resolved, case closed without explanation."

  - id: archive_return
    type: narrative
    text: |
      Whatever this was, it's not something you can act on right now --
      just an old paper trail nobody ever followed up on. Still, it's the
      kind of thing worth remembering.

      GHOST: "Filed away for later, then. Sentinel's still waiting."
    choices:
      - text: "Back to it."
        next: discovery

  - id: ending_backed_out
    type: ending
    text: |
      You cut the connection and never look back. Whatever sentinel was
      doing, it's not your problem anymore -- or at least that's what
      you tell yourself at 4 AM, still wide awake.

      -- ENDING: Plausible Deniability --
